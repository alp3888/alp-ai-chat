<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>終活・身元保証のご相談 | アドバンスライフプランニング株式会社</title>
  <style>
    body { font-family: "Hiragino Sans", "Meiryo", sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; color: #333; line-height: 1.6; }
    h2 { border-bottom: 2px solid #1b4965; padding-bottom: 8px; color: #1b4965; font-size: 20px; }
    #chat-box { height: 420px; border: 1px solid #e0e0e0; overflow-y: auto; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fcfcfc; }
    .message { margin: 12px 0; padding: 12px 16px; border-radius: 8px; display: inline-block; max-width: 82%; font-size: 15px; }
    .user { background: #1b4965; color: #fff; float: right; clear: both; }
    .ai { background: #f0f7f7; color: #222; float: left; clear: both; border: 1px solid #d0e5e5; }
    #contact-form { display: none; background: #fffde7; padding: 20px; border-radius: 8px; margin-top: 15px; border: 1px solid #fff59d; }
    .input-area { display: flex; gap: 10px; clear: both; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { padding: 12px 20px; background: #1b4965; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
    button:hover { background: #0b2545; }
  </style>
</head>

<body>

<h2>アドバンスライフプランニング株式会社<br><small style="font-size: 13px; font-weight: normal; color: #666;">これからの暮らし・終活のご相談窓口</small></h2>

<div id="chat-box">
  <div class="message ai">こんにちは。アドバンスライフプランニング（ALP）のご相談窓口です。<br><br>身元保証やこれからの生活、ご自宅の将来のことなど、今気になっていることやご不安な点はございますか？どのようなことでもお気軽にお話しください。</div>
</div>

<div class="input-area" id="input-area">
  <input type="text" id="user-input" placeholder="メッセージを入力してください...">
  <button onclick="sendMessage()">送信</button>
</div>

<!-- 持ち家で終活ご希望のユーザーに表示するフォーム -->
<div id="contact-form">
  <h3>詳しいご案内・個別相談のご予約</h3>
  <p>お客様のお悩みに合わせた資料のお届けや、専門スタッフによる個別のご相談（無料）を承っております。ご連絡先をご入力ください。</p>

  <form id="lead-form" onsubmit="submitLead(event)">
    <p><label>お名前:<br><input type="text" required name="name" style="width: 100%; box-sizing: border-box; padding: 8px;"></label></p>
    <p><label>電話番号:<br><input type="tel" required name="phone" style="width: 100%; box-sizing: border-box; padding: 8px;"></label></p>
    <p><label>メールアドレス:<br><input type="email" required name="email" style="width: 100%; box-sizing: border-box; padding: 8px;"></label></p>
    <button type="submit" style="width: 100%; margin-top: 10px;">送信して相談を申し込む</button>
  </form>
</div>

<script>
  let chatHistory = [];

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    input.value = '';

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: chatHistory, userMessage: text })
      });

      const data = await response.json();
      appendMessage(data.message, 'ai');

      // 履歴更新
      chatHistory.push({ role: 'user', text: text });
      chatHistory.push({ role: 'model', text: data.message });

      // ステータスに応じた制御
      if (data.status === 'OWNER_LEAD') {
        document.getElementById('input-area').style.display = 'none';
        document.getElementById('contact-form').style.display = 'block';
      } else if (data.status === 'OTHER_COMPLETE' || data.status === 'SPAM_REJECT') {
        document.getElementById('input-area').style.display = 'none'; // 他窓口へのアドバイス等を伝えて受付完了
      }

    } catch (err) {
      appendMessage('通信エラーが発生しました。お手数ですが、時間をおいて再度お試しください。', 'ai');
    }
  }

  function appendMessage(text, sender) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = text.replace(/\n/g, '<br>');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function submitLead(e) {
    e.preventDefault();
    alert('ご相談の申し込みを受け付けました。担当者より折り返しご連絡いたします。');
  }
</script>
</body>
</html>
